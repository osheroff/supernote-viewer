name: SupernoteViewer
options:
  bundleIdPrefix: dev.schaefer
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    # Ad-hoc by default so any clone builds; install.sh and release.sh override this.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "4"

packages:
  SupernoteKit:
    path: SupernoteKit

targets:
  # Opens .note/.mark/.pdf in its own windows (thumbnails, live reload, measuring).
  SupernoteViewer:
    type: application
    platform: macOS
    sources: [Shared, Viewer]
    info:
      path: Viewer/Info.plist
      properties:
        CFBundleDisplayName: Supernote Viewer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        CFBundleDocumentTypes:
          - CFBundleTypeName: Supernote Notebook
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.schaefer.supernote.note]
          - CFBundleTypeName: Supernote PDF Annotations
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.schaefer.supernote.mark]
          # PDFs open here via Open With; Preview stays the default.
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
        NSServices:
          - NSMenuItem:
              default: Measure in Supernote Viewer
            NSMessage: measureFiles
            NSPortName: Supernote Viewer
            NSRequiredContext: {}
            NSSendFileTypes:
              - dev.schaefer.supernote.note
              - dev.schaefer.supernote.mark
              - com.adobe.pdf
        UTExportedTypeDeclarations: &supernoteTypes
          - UTTypeIdentifier: dev.schaefer.supernote.note
            UTTypeDescription: Supernote Notebook
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [note]
          - UTTypeIdentifier: dev.schaefer.supernote.mark
            UTTypeDescription: Supernote PDF Annotations
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [mark]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schaefer.SupernoteViewer
        PRODUCT_NAME: Supernote Viewer
    dependencies:
      - package: SupernoteKit
        product: SupernoteKit
      - target: QuickLookPreview
        embed: true
        codeSign: true

  # Renders .note/.mark to PDF and hands it to Preview.app.
  SupernotePreviewBridge:
    type: application
    platform: macOS
    sources: [Shared, Bridge]
    info:
      path: Bridge/Info.plist
      properties:
        CFBundleDisplayName: Supernote Preview Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSPrincipalClass: NSApplication
        # No Dock icon: opening a file hands it straight to Preview.
        LSUIElement: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Supernote Notebook
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.schaefer.supernote.note]
          - CFBundleTypeName: Supernote PDF Annotations
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [dev.schaefer.supernote.mark]
        # Supernote Viewer exports these types; importing keeps them defined without it.
        UTImportedTypeDeclarations: *supernoteTypes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schaefer.SupernotePreviewBridge
        PRODUCT_NAME: Supernote Preview Bridge
    dependencies:
      - package: SupernoteKit
        product: SupernoteKit

  QuickLookPreview:
    type: app-extension
    platform: macOS
    sources: [QuickLookPreview]
    info:
      path: QuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: Supernote Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewProvider
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - dev.schaefer.supernote.note
              - dev.schaefer.supernote.mark
    entitlements:
      path: QuickLookPreview/QuickLookPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        # Lets the preview of X.pdf.mark read the sibling X.pdf.
        com.apple.security.temporary-exception.files.absolute-path.read-only: ["/"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.schaefer.SupernoteViewer.QuickLookPreview
    dependencies:
      - package: SupernoteKit
        product: SupernoteKit
